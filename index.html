<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Device Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 10px;}
        #status { margin-top: 20px; font-weight: bold; font-size: 15px;}
        
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #7dd3fc; }
        
        #returnBtn {
            background-color: #22c55e;
            color: white;
            display: none;
            margin-top: 15px;
            text-decoration: none;
        }
        #returnBtn:hover { background-color: #16a34a; }
        
        .btn:disabled { background-color: #475569; cursor: not-allowed; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Device Verification</h2>
        <p>Please verify your device to secure your entry. One device is allowed per user.</p>
        <p style="color: #facc15; font-size: 12px;">Note: This device will be locked after successful verification.</p>
        
        <button id="verifyBtn" class="btn" onclick="verifyDevice()">Verify My Device</button>
        
        <p id="status"></p>
        <a id="returnBtn" class="btn" href="#">✅ Return to Telegram</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');

        const botUsername = "realsvotebot";
        document.getElementById('returnBtn').href = `https://t.me/${botUsername}`;

        window.onload = function() {
            const statusText = document.getElementById('status');
            const verifyBtn = document.getElementById('verifyBtn');

            if (!userId) {
                statusText.style.color = "#ef4444";
                statusText.innerText = "⚠️ Error: User ID not found! Please open this link directly from your Telegram bot using the Verify button.";
                verifyBtn.disabled = true;
                verifyBtn.innerText = "Invalid Session";
                return;
            }

            if (localStorage.getItem('telegram_bot_verified')) {
                statusText.style.color = "#ef4444";
                statusText.innerText = "⚠️ Verification Already Completed! This device has already been locked for another account.";
                verifyBtn.disabled = true;
                verifyBtn.innerText = "Already Verified";
            }
        }

        function verifyDevice() {
            const statusText = document.getElementById('status');
            const verifyBtn = document.getElementById('verifyBtn');
            const returnBtn = document.getElementById('returnBtn');
            
            if (!userId) {
                alert("User ID missing!");
                return;
            }

            if (localStorage.getItem('telegram_op_verified') || localStorage.getItem('telegram_bot_verified')) {
                return;
            }

            statusText.style.color = "#facc15";
            statusText.innerText = "Verifying device securely...";
            verifyBtn.disabled = true;
            verifyBtn.innerText = "Processing...";
            
            setTimeout(() => {
                localStorage.setItem('telegram_bot_verified', userId);
                
                statusText.style.color = "#4ade80";
                statusText.innerText = "✅ Device Verified Successfully! You can now return to Telegram.";
                verifyBtn.style.display = "none";
                returnBtn.style.display = "block";
            }, 1500);
        }
    </script>
</body>
</html>
