<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Device Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 10px;}
        #status { margin-top: 20px; font-weight: bold; font-size: 15px;}
        
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #7dd3fc; }
        
        #returnBtn {
            background-color: #22c55e; /* Green */
            color: white;
            display: none; /* Hidden by default */
            margin-top: 15px;
        }
        #returnBtn:hover { background-color: #16a34a; }
        
        .btn:disabled { background-color: #475569; cursor: not-allowed; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Device Verification</h2>
        <p>Please verify your device to secure your entry. One device is allowed per user.</p>
        <p style="color: #facc15; font-size: 12px;">Note: This device will be locked after verification.</p>
        
        <button id="verifyBtn" class="btn" onclick="verifyDevice()">Verify My Device</button>
        
        <!-- Success Message & Return Button -->
        <p id="status"></p>
        <a id="returnBtn" class="btn" href="tg://resolve?domain=TERA_BOT_USERNAME_YAHAN_DAALE" onclick="setVerifiedFlag()">✅ Return to Telegram & Complete</a>
    </div>

    <script>
        // 1. Replace TERA_BOT_USERNAME_YAHAN_DAALE with your actual Telegram bot username (without the @ symbol)
        const botUsername = "TERA_BOT_USERNAME_YAHAN_DAALE";
        
        // Update the href with the correct bot username
        document.getElementById('returnBtn').href = `tg://resolve?domain=${botUsername}&start=verify_success`;

        function verifyDevice() {
            const statusText = document.getElementById('status');
            const verifyBtn = document.getElementById('verifyBtn');
            const returnBtn = document.getElementById('returnBtn');
            
            // 2. Check for existing lock in LocalStorage
            const deviceLocked = localStorage.getItem('telegram_bot_verified');
            
            if (deviceLocked) {
                statusText.style.color = "#ef4444"; // Red
                statusText.innerText = "⚠️ Verification Already Completed! This device has already been used for verification from a previous account.";
                verifyBtn.disabled = true;
                verifyBtn.innerText = "Already Verified";
                return;
            }

            // 3. Run verification process
            statusText.style.color = "#facc15"; // Yellow
            statusText.innerText = "Checking device fingerprint...";
            verifyBtn.disabled = true;
            verifyBtn.innerText = "Processing...";
            
            setTimeout(() => {
                // 4. If successful, set the lock and show return button
                localStorage.setItem('telegram_bot_verified', 'true');
                
                statusText.style.color = "#4ade80"; // Green
                statusText.innerText = "✅ Device Verified Successfully! This device is now locked.";
                verifyBtn.style.display = "none";
                returnBtn.style.display = "block"; // Show the button to go back to Telegram
            }, 1500);
        }

        // On page load, check if already locked
        window.onload = function() {
            if (localStorage.getItem('telegram_bot_verified')) {
                 const statusText = document.getElementById('status');
                 const verifyBtn = document.getElementById('verifyBtn');
                 statusText.style.color = "#ef4444";
                 statusText.innerText = "⚠️ Verification Already Completed on this device.";
                 verifyBtn.disabled = true;
                 verifyBtn.innerText = "Already Verified";
            }
        }

        // Optional: When returning, you could send a signal to the bot if you had a backend.
        function setVerifiedFlag() {
            // localStorage is already set, so we just let the link open Telegram.
            console.log("Returning to Telegram...");
        }
    </script>
</body>
</html>
