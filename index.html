<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Giveaway Vote Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover { background-color: #16a34a; }
        .error { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="content">
        <h2>🔒 Secure Device Verification</h2>
        <p>Click below to securely verify your Telegram account and cast your vote.</p>
        <button class="btn" id="voteBtn" onclick="submitVote()">Verify & Cast Vote</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let gw = urlParams.get('gw');
        let opt = urlParams.get('opt');

        async function submitVote() {
            const btn = document.getElementById('voteBtn');
            btn.disabled = true;
            btn.innerText = "Verifying Telegram Account...";

            // Telegram ka official initData lo (yeh asli user ID verify karne ke liye zaroori hai)
            const initData = tg.initData || '';

            if (!initData) {
                document.getElementById('content').innerHTML = `
                    <h2 class="error">❌ Security Error</h2>
                    <p>Please open this link directly from the official Telegram app bot button.</p>
                    <button class="btn" onclick="tg.close()">Close</button>
                `;
                return;
            }

            const backendUrl = `https://telegram-giveaway-bots.onrender.com/vote`;

            try {
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gw, opt: Number(opt), initData })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('content').innerHTML = `
                        <h2 style="color: #4ade80;">✅ Vote Recorded Successfully!</h2>
                        <p>Your vote has been counted securely. You can now return to Telegram.</p>
                        <button class="btn" onclick="tg.close()">Return to Telegram</button>
                    `;
                } else {
                    document.getElementById('content').innerHTML = `
                        <h2 class="error">⚠️ Notice</h2>
                        <p>${data.message || 'You have already voted or verification failed.'}</p>
                        <button class="btn" onclick="tg.close()">Return to Telegram</button>
                    `;
                }
            } catch (err) {
                document.getElementById('content').innerHTML = `
                    <h2 class="error">❌ Connection Error</h2>
                    <p>Could not connect to server. Please try again.</p>
                    <button class="btn" onclick="tg.close()">Return to Telegram</button>
                `;
            }
        }
    </script>
</body>
</html>
