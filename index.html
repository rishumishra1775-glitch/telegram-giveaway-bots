<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway Vote Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover { background-color: #16a34a; }
        .error { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card" id="content">
        <h2>🔒 Device Verification</h2>
        <p>Click the button below to verify your device and successfully cast your vote for this poll.</p>
        <button class="btn" id="voteBtn" onclick="submitVote()">Verify & Cast Vote</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let gw = urlParams.get('gw');
        let opt = urlParams.get('opt');
        
        // Telegram WebApp se real user id nikalne ki koshish, warna fallback
        let userId = tg.initDataUnsafe?.user?.id || urlParams.get('user') || 'anon_' + Math.random();

        async function submitVote() {
            const btn = document.getElementById('voteBtn');
            btn.disabled = true;
            btn.innerText = "Verifying & Recording Vote...";

            // Yahan apne Render backend ka live URL dalna agar zaroorat ho, 
            // ya agar same domain par hai toh relative path use karein:
            const backendUrl = `https://YOUR-RENDER-APP-URL.onrender.com/vote?gw=${gw}&opt=${opt}&user=${userId}`;

            try {
                const response = await fetch(backendUrl);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('content').innerHTML = `
                        <h2 style="color: #4ade80;">✅ Vote Recorded Successfully!</h2>
                        <p>Your vote has been counted. You can now return back to Telegram.</p>
                        <button class="btn" onclick="tg.close()">Return to Telegram</button>
                    `;
                } else {
                    document.getElementById('content').innerHTML = `
                        <h2 class="error">⚠️ Notice</h2>
                        <p>${data.message || 'You have already voted or an error occurred.'}</p>
                        <button class="btn" onclick="tg.close()">Return to Telegram</button>
                    `;
                }
            } catch (err) {
                document.getElementById('content').innerHTML = `
                    <h2 class="error">❌ Connection Error</h2>
                    <p>Could not connect to the voting server. Please try again later.</p>
                    <button class="btn" onclick="tg.close()">Return to Telegram</button>
                `;
            }
        }
    </script>
</body>
</html>
